doxygen-test:
  image:
    name: registry.cern.ch/docker.io/ubuntu:latest
  stage: test
  dependencies: []
  before_script:
    - apt-get update
    - apt-get install -y doxygen
  script:
    - cd docs
    - doxygen Doxyfile
  artifacts:
    paths:
      - docs/html
    expire_in: 6 h

doxygen-deploy:
  stage: deploy
  dependencies:
    - doxygen-test
  image: gitlab-registry.cern.ch/ci-tools/ci-web-deployer:latest
  rules:
    - if: $CI_COMMIT_TAG != null
  script:
    - mv docs/html public
    - deploy-eos
