make-gentoo-apptainer-image:
  tags:
    - docker-privileged-xl
  image:
    name: gitlab-registry.cern.ch/linuxsupport/alma10-base
  stage: build
  dependencies: []
  before_script:
    - dnf install -y epel-release
    - dnf install -y apptainer xrootd-client
    - echo $KERBEROS_PASSWORD | kinit ${KERBEROS_USER}
  script:
    - apptainer build --build-arg project_dir="$CI_PROJECT_DIR" adaptyst.sif $CI_PROJECT_DIR/apptainer.def
    - |
      if [[ "$CI_COMMIT_TAG" != "" ]]; then
        xrdcp -C auto --rm-bad-cksum -t 5 adaptyst.sif root://eosuser.cern.ch/$WEB_STORAGE/apptainer/adaptyst-$CI_COMMIT_TAG.sif
      elif [[ "$CI_PIPELINE_SOURCE" == "web" || "$CI_COMMIT_BRANCH" == "dev" ]]; then
        xrdcp -C auto --rm-bad-cksum -t 5 adaptyst.sif root://eosuser.cern.ch/$WEB_STORAGE_TMP/apptainer/adaptyst-$CI_COMMIT_SHORT_SHA.sif
      fi
  after_script:
    - rm -f adaptyst.sif
    - kdestroy -A

